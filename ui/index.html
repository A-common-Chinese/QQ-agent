<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ Agent</title>
  <!-- 内容安全策略：控制台只应加载本机资源。
       首屏主题预置脚本必须内联（否则会闪白），用它的 sha256 hash 精确放行 ——
       不再用 'unsafe-inline'（页面多处 innerHTML 拼接，一旦任何一处被注入，
       unsafe-inline 会让 onerror= 等内联代码直接执行，CSP 形同虚设）。
       内联样式仍放行（style-src）：主题/布局大量使用内联 style 属性。
       2026-09-26 例外：意见收集/金句上传引入阿里云验证码 2.0（防垃圾上传），
       官方要求必须动态加载 o.alicdn.com 的 SDK 并直连 aliyuncs 验签域，
       故 script-src / connect-src / frame-src / worker-src 增列对应来源，
       其余仍锁死在 'self'。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-4ln+HNcX+/7mNZCuF0QQmlz+DCA5rUVmxOBcpZ5RR+U=' https://o.alicdn.com https://kondius.cn; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob:; connect-src 'self' https://kondius.cn https://*.aliyuncs.com https://*.alicdn.com; frame-src https://*.aliyuncs.com https://*.alicdn.com https://kondius.cn; worker-src 'self' blob: https://*.alicdn.com https://kondius.cn; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <link rel="stylesheet" href="/style.css?v=20261023c" />
  <script>
    /* 主题预置：在样式生效前定好 data-theme，避免首屏闪白/闪黑。
       2026-10 改版：默认浅色；支持 浅色 / 深色 / 跟随系统 三档。
       这里只做"应用"，真正的切换逻辑与持久化在前端脚本。 */
    (function () {
      try {
        var saved = localStorage.getItem('qqa-theme') || '';
        var pref = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'light';
        var theme = pref;
        if (pref === 'auto') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 左侧竖向主栏：5 个主项（技能/插件走右下悬浮菜单，见 #nav-extra 里的隐藏入口） -->
    <aside id="sidebar">
      <div class="brand">QQ Agent <span class="brand-sub"></span></div>

      <nav id="tabs">
        <button class="tab active" data-tab="sessions" title="会话">
          <svg class="tab-ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2.5" width="14" height="9.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 12.2 L6.2 15.2" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          <span>会话</span>
        </button>
        <button class="tab" data-tab="chats" title="存档">
          <svg class="tab-ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.2" y="3" width="13.6" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.2 7 H14.8" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>存档</span>
        </button>
        <button class="tab" data-tab="memory" title="记忆">
          <svg class="tab-ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2.6" y="1.8" width="10.8" height="12.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.2 5.6 H10.8 M5.2 8.4 H10.8" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>记忆</span>
        </button>
        <button class="tab" data-tab="usage" title="用量">
          <svg class="tab-ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 13.4 V9 M6 13.4 V5 M10 13.4 V7.4 M14 13.4 V2.6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <span>用量</span>
        </button>
        <button class="tab" data-tab="settings" title="设置">
          <svg class="tab-ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.1" fill="currentColor"/></svg>
          <span>设置</span>
        </button>
      </nav>

      <!-- 这 3 个页签不出现在主栏：第 3 步会把它们挂到右下悬浮菜单里。
           保留成 data-tab 按钮，switchTab / 视图切换 / 测试口径都不变。 -->
      <div id="nav-extra" hidden>
        <button class="tab" data-tab="skills">技能</button>
        <button class="tab" data-tab="plugins">插件</button>
        <button class="tab" data-tab="snowluma">QQ 接口</button>
      </div>

      <div id="sidebar-foot">
        <div class="sf-row">
          <span id="onebot-dot" class="dot dot-off" title="OneBot 连接状态"></span>
          <span id="onebot-label" class="muted">OneBot 未连接</span>
        </div>
        <div class="sf-row"><span id="model-label" class="muted">模型：-</span></div>
        <div class="sf-row sf-actions">
          <button id="pause-btn" class="btn btn-small">暂停</button>
          <button id="theme-btn" class="icon-btn" title="切换主题" aria-label="切换主题"></button>
        </div>
        <div class="sf-row"><span id="sidebar-version" class="muted"></span></div>
      </div>
      <div id="sidebar-resizer" title="拖动调整侧栏宽度（双击恢复默认 236）"></div>
    </aside>

    <div id="main">
      <header id="topbar">
        <div id="page-title">会话</div>
        <div class="top-status">
          <!-- 状态胶囊带：窄窗口下横向滚动（不折行、不裁切）；右侧控件固定可见 -->
          <div class="top-chips">
            <span id="usage-label" class="muted">今日：-</span>
            <span class="sep"></span>
            <span id="search-count-label" class="muted" title="今日联网搜索次数（web_search / web_fetch）">搜索：-</span>
            <span class="sep"></span>
            <!-- 就绪进度指示器：4 圆点 = QQ运行 / SnowLuma运行 / OneBot连接 / 配置完成 -->
            <span id="readiness-dots" class="readiness-dots" title="就绪进度：点击跳转到对应设置">
              <span class="rdot" data-target="snowluma" title="QQ 内核未运行"></span>
              <span class="rdot" data-target="snowluma" title="SnowLuma 未运行"></span>
              <span class="rdot" data-target="snowluma" title="OneBot 未连接"></span>
              <span class="rdot" data-target="settings" title="配置未完成"></span>
            </span>
          </div>
          <div id="top-actions">
            <!-- 2026-10 改版：原顶栏的社区/市场按钮已收进右下悬浮菜单（#fab）。
                 这 4 个按钮保留为 hidden，只作为"旧逻辑的入口"：市场/人设/官网的既有
                 绑定（09-community.js）与技能/插件页内的「打开市场」按钮都点它。
                 金句上传 / 意见收集按需求移除（底层代码不再有可见入口）。 -->
            <button class="hidden" id="skill-market-btn" type="button" aria-hidden="true" aria-label="Skill 市场"></button>
            <button class="hidden" id="plugin-market-btn" type="button" aria-hidden="true" aria-label="插件市场"></button>
            <button class="hidden" id="persona-plaza-btn" type="button" aria-hidden="true" aria-label="人设广场"></button>
            <button class="hidden" id="open-site-btn" type="button" aria-hidden="true" aria-label="打开网站"></button>
            <button class="hidden" id="quote-btn" type="button" aria-hidden="true" aria-label="金句上传"></button>
            <button class="hidden" id="feedback-btn" type="button" aria-hidden="true" aria-label="意见收集"></button>
            <button class="hidden" id="quote-confirm-btn" type="button" aria-hidden="true" aria-label="确认金句"></button>
          </div>
        </div>
      </header>

      <!-- 二级菜单：由 renderSubnav() 按当前主项渲染（记忆页 = 三张卡 ｜ 压缩） -->
      <div id="subnav" class="subnav"></div>

      <div id="banner" class="banner hidden"></div>
      <!-- 未就绪时才出现：就绪度体检卡（接口/模型/白名单/OneBot 逐项） -->
      <div id="health-card-wrap" class="health-card-wrap hidden"></div>

      <main id="layout">
        <!-- 会话视图 -->
        <section id="view-sessions" class="view active">
          <aside id="session-list" class="list-pane">
            <div class="list-head muted"><span id="session-count"></span><button class="list-head-btn" id="session-broadcast-btn" title="给选中的群/私聊批量发送一条消息">群发</button><button class="list-head-btn" id="session-clear-btn" title="清空全部已结束的会话记录（保留运行中/等待中的）">清空</button></div>
            <div id="session-items"></div>
            <div id="session-more" class="list-more muted"></div>
            <div class="list-resizer" id="session-list-resizer" title="拖动调整侧栏宽度"></div>
          </aside>
          <div id="session-detail" class="detail-pane">
            <div class="empty-hint">← 选择左侧会话查看完整过程</div>
          </div>
        </section>

        <!-- 存档视图 -->
        <section id="view-chats" class="view">
          <aside id="chat-list" class="list-pane">
            <div class="list-head muted">消息存档</div>
            <div id="chat-items"></div>
            <div class="list-resizer" id="chat-list-resizer" title="拖动调整侧栏宽度"></div>
          </aside>
          <div id="chat-detail" class="detail-pane">
            <div class="empty-hint">← 选择会话查看消息存档</div>
          </div>
        </section>

        <!-- QQ 接口视图（OneBot / 官方机器人） -->
        <section id="view-snowluma" class="view">
          <div id="snowluma-page" class="snowluma-pane"></div>
        </section>

        <!-- 记忆视图 -->
        <section id="view-memory" class="view">
          <aside id="memory-list" class="list-pane">
            <div class="list-head muted">记忆</div>
            <div id="memory-items"></div>
            <div class="list-resizer" id="memory-list-resizer" title="拖动调整侧栏宽度"></div>
          </aside>
          <div id="memory-detail" class="detail-pane">
            <div class="empty-hint">← 选择会话查看记忆</div>
          </div>
        </section>

        <!-- 用量视图 -->
        <section id="view-usage" class="view">
          <div id="usage-page" class="usage-pane"></div>
        </section>

        <!-- 技能视图：从设置页独立出来（原先和模型/聊天设置挤在一起，找不到） -->
        <section id="view-skills" class="view">
          <div id="skills-page" class="usage-pane"></div>
        </section>

        <!-- 插件视图：与技能并列的独立页签。
             两型的区别在"谁决定何时执行"（确定性 vs 模型决定），是使用者最关心的一件事，
             所以分成两页各自成组 —— 混在一页里既看不出类型，也数不清各有多少。 -->
        <section id="view-plugins" class="view">
          <div id="plugins-page" class="usage-pane"></div>
        </section>

        <!-- 设置视图 -->
        <section id="view-settings" class="view">
          <aside id="settings-sidebar" class="settings-sidebar"></aside>
          <div id="settings-form" class="settings-pane"></div>
        </section>
      </main>
    </div>
  </div>


  <!-- 右下悬浮菜单（三条杠，C1 向上列表）：九条四组 -->
  <div id="fab" class="fab">
    <div id="fab-menu" class="fab-menu" hidden role="menu" aria-label="更多功能">
      <div class="fab-group">
        <div class="fab-gtitle">服务</div>
        <button class="fab-item" data-fab="snowluma" role="menuitem">QQ 接口</button>
      </div>
      <div class="fab-group">
        <div class="fab-gtitle">扩展</div>
        <button class="fab-item" data-fab="skills" role="menuitem">技能</button>
        <button class="fab-item" data-fab="plugins" role="menuitem">插件</button>
      </div>
      <div class="fab-group">
        <div class="fab-gtitle">社区</div>
        <button class="fab-item" data-fab="persona" role="menuitem">人设广场</button>
        <button class="fab-item" data-fab="site" role="menuitem">官方网站</button>
      </div>
      <div class="fab-group">
        <div class="fab-gtitle">帮助与维护</div>
        <button class="fab-item" data-fab="bug" role="menuitem">Bug 反馈</button>
        <button class="fab-item" data-fab="update" role="menuitem">检查更新</button>
        <button class="fab-item" data-fab="datadir" role="menuitem">打开数据目录</button>
      </div>
    </div>
    <button id="fab-btn" class="fab-btn" aria-label="更多功能（技能 / 插件 / SnowLuma / 反馈）" aria-expanded="false" aria-haspopup="menu">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-title">QQ Agent 正在启动</div>
      <div class="loading-sub" id="loading-status">正在启动 SnowLuma 与 OneBot 服务，请稍候…</div>
      <div class="loading-spinner"></div>
      <pre class="loading-logs" id="loading-logs"></pre>
    </div>
  </div>

  <!-- M9 拆分：ESM 桥（vendor 模块 → window）先执行；其后 12 段普通脚本按 defer 顺序执行，
       module 与 defer 共享同一条按文档顺序的延迟队列，保证桥先于 00-core.js 执行。 -->
  <script type="module" src="/app.js"></script>
  <script defer src="/app/00-core.js?v=20261023a"></script>
  <script defer src="/app/01-boot.js"></script>
  <script defer src="/app/02-sse-sessions.js?v=20261022m"></script>
  <script defer src="/app/03-snowluma.js"></script>
  <script defer src="/app/04-archive-usage.js"></script>
  <script defer src="/app/05-memory-settings.js?v=20261023a"></script>
  <script defer src="/app/06-settings-render.js?v=20261023b"></script>
  <script defer src="/app/07-settings-events.js?v=20261023a"></script>
  <script defer src="/app/08-modals.js"></script>
  <script defer src="/app/09-community.js"></script>
  <script defer src="/app/10-feedback.js?v=20261022u"></script>
  <script defer src="/app/12-concept2-ui.js?v=20261022g"></script>
  <script defer src="/app/13-fab.js?v=20261023a"></script>
  <script defer src="/app/14-usage-chart.js?v=20261023a"></script>
  <script defer src="/app/15-ui-skin.js?v=20261023a"></script>
  <script defer src="/app/16-boot.js?v=20261023a"></script>
  <script defer src="/app/11-init.js?v=20261023a"></script>

  <!-- 阿里云验证码 2.0（意见收集/金句上传共用）：容器常驻；AliyunCaptchaConfig 与
       SDK 动态加载都在 10-feedback.js 内（CSP 不放行无 hash 内联脚本）。 -->
  <div id="captcha-element"></div>
  <button id="captcha-trigger" type="button" aria-label="人机验证触发器（隐藏元素，SDK 内部使用）" style="position:fixed;left:-9999px;top:0" aria-hidden="true" tabindex="-1"></button>
</body>
</html>
